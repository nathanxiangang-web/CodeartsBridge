[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "codex-glm-bridge"
version = "1.0.0"
description = "CodeartsBridge — 多 AI 软件开发任务控制平面，Agent transport + 事件驱动架构师 + Control Center UI"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
bridge = "bridge.cli:main"
bridge-worker-agent = "bridge.agent.cli:main"
show-progress = "bridge.progress:show_progress_main"
watch-tasks = "bridge.progress:watch_tasks_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
