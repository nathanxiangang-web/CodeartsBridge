[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "codex-glm-bridge"
version = "2.0.0"
description = "Codex <-> GLM Worker Bridge - Linux native"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
bridge = "bridge.cli:main"
bridge-daemon = "bridge.daemon:main"
show-progress = "bridge.progress:show_progress_main"
watch-tasks = "bridge.progress:watch_tasks_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]