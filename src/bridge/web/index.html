<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeartsBridge 控制台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9}
.nav{background:#161b22;padding:12px 24px;display:flex;gap:24px;align-items:center;border-bottom:1px solid #30363d}
.nav a{color:#8b949e;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px}
.nav a:hover{background:#21262d;color:#c9d1d9}
.nav a.active{background:#1f6feb;color:#fff}
.nav .brand{font-weight:700;font-size:16px;color:#f0f6fc;margin-right:16px}
.container{max-width:1200px;margin:0 auto;padding:24px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;color:#8b949e;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stat{text-align:center}
.stat .num{font-size:28px;font-weight:700}
.stat .label{font-size:12px;color:#8b949e;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #21262d}
th{color:#8b949e;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-created{background:#1f6feb33;color:#58a6ff}
.badge-queued{background:#f0883e33;color:#f0883e}
.badge-running{background:#f0883e33;color:#f0883e}
.badge-verifying{background:#a371f733;color:#a371f7}
.badge-review_required{background:#d2992233;color:#d29922}
.badge-review_passed{background:#3fb95033;color:#3fb950}
.badge-fix_required{background:#f8514933;color:#f85149}
.badge-fixing{background:#f0883e33;color:#f0883e}
.badge-approved{background:#3fb95033;color:#3fb950}
.badge-integrating{background:#a371f733;color:#a371f7}
.badge-integrated{background:#3fb95033;color:#3fb950}
.badge-done{background:#3fb95033;color:#3fb950}
.badge-cancelled{background:#6e768133;color:#8b949e}
.badge-failed{background:#f8514933;color:#f85149}
.btn{padding:6px 14px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:13px}
.btn:hover{background:#30363d}
.btn-primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn-danger{background:#f8514933;border-color:#f85149;color:#f85149}
input,select,textarea{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px 10px;color:#c9d1d9;font-size:13px}
input,select,textarea{width:100%}
.form-row{display:flex;gap:12px;margin-bottom:12px;align-items:center}
.form-row label{width:120px;font-size:13px;color:#8b949e}
.form-row input,.form-row select{flex:1}
.muted{color:#8b949e}
.hidden{display:none}
#content{min-height:400px}
</style>
</head>
<body>
<nav class="nav">
<span class="brand">CodeartsBridge</span>
<a href="#dashboard" class="nav-link active" data-page="dashboard">仪表盘</a>
<a href="#projects" class="nav-link" data-page="projects">项目</a>
<a href="#tasks" class="nav-link" data-page="tasks">任务</a>
<a href="#workers" class="nav-link" data-page="workers">工作节点</a>
<a href="#review" class="nav-link" data-page="review">审查</a>
<a href="#settings" class="nav-link" data-page="settings">设置</a>
</nav>
<div class="container">
<div id="content"></div>
</div>
<script>
const API='/api';
const stateMap={created:'已创建',ready:'就绪',queued:'排队中',starting:'启动中',running:'运行中',verifying:'验证中',review_required:'待审查',review_passed:'审查通过',fix_required:'需修复',fixing:'修复中',approved:'已批准',integrating:'集成中',integrated:'已集成',done:'已完成',cancelled:'已取消',failed:'失败'};
async function api(path,opts){const r=await fetch(API+path,opts);try{return await r.json()}catch(e){return{error:String(e)}}}
function badge(s){return `<span class="badge badge-${s}">${stateMap[s]||s}</span>`}
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}

async function loadDashboard(){
const h=await api('/health');
const tasks=await api('/tasks');
const workers=await api('/workers');
const byState={};
(tasks.tasks||[]).forEach(t=>{byState[t.state]=(byState[t.state]||0)+1});
const online=(workers.workers||[]).filter(w=>w.enabled).length;
const offline=(workers.workers||[]).filter(w=>!w.enabled).length;
return `
<div class="card"><h2>桥接状态</h2><p class="muted">版本 ${esc(h.version||'?')} · 根目录: ${esc(h.bridge_root||'?')}</p></div>
<div class="card"><h2>工作节点</h2><div class="grid">
<div class="stat"><div class="num" style="color:#3fb950">${online}</div><div class="label">在线</div></div>
<div class="stat"><div class="num" style="color:#8b949e">${offline}</div><div class="label">离线</div></div>
<div class="stat"><div class="num">${(workers.workers||[]).length}</div><div class="label">总计</div></div>
</div></div>
<div class="card"><h2>任务</h2><div class="grid">
${Object.entries(byState).map(([s,n])=>`<div class="stat"><div class="num">${n}</div><div class="label">${esc(stateMap[s]||s)}</div></div>`).join('')}
${Object.keys(byState).length===0?'<p class="muted">暂无任务</p>':''}
</div></div>
<div class="card"><h2>最近任务</h2>
<table><tr><th>ID</th><th>状态</th><th>项目</th><th>角色</th></tr>
${(tasks.tasks||[]).slice(0,10).map(t=>`<tr><td>${esc(t.task_id)}</td><td>${badge(t.state)}</td><td>${esc(t.project_id)}</td><td>${esc(t.role)}</td></tr>`).join('')}
</table></div>`;
}

async function loadProjects(){
const r=await api('/projects');
return `
<div class="card"><h2>项目列表</h2>
<table><tr><th>ID</th><th>名称</th><th>仓库</th><th>分支</th></tr>
${(r.projects||[]).map(p=>`<tr><td>${esc(p.project_id||p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.repo_url||p.repo||'-')}</td><td>${esc(p.branch||'-')}</td></tr>`).join('')}
</table></div>
<div class="card"><h2>添加项目</h2>
<div class="form-row"><label>项目 ID</label><input id="pj-id"></div>
<div class="form-row"><label>名称</label><input id="pj-name"></div>
<div class="form-row"><label>仓库地址</label><input id="pj-repo"></div>
<div class="form-row"><label>分支</label><input id="pj-branch" value="main"></div>
<button class="btn btn-primary" onclick="addProject()">添加</button>
</div>`;
}

async function addProject(){
const body={project_id:document.getElementById('pj-id').value,name:document.getElementById('pj-name').value,repo_url:document.getElementById('pj-repo').value,branch:document.getElementById('pj-branch').value};
await api('/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
location.reload();
}

async function loadTasks(){
const r=await api('/tasks');
return `
<div class="card"><h2>任务列表</h2>
<table><tr><th>ID</th><th>状态</th><th>项目</th><th>工作节点</th><th>角色</th><th>尝试次数</th><th>操作</th></tr>
${(r.tasks||[]).map(t=>`<tr><td>${esc(t.task_id)}</td><td>${badge(t.state)}</td><td>${esc(t.project_id)}</td><td>${esc(t.worker_id||'-')}</td><td>${esc(t.role)}</td><td>${t.attempt||0}</td>
<td><button class="btn" onclick="cancelTask('${esc(t.task_id)}')">取消</button></td></tr>`).join('')}
</table></div>
<div class="card"><h2>创建任务</h2>
<div class="form-row"><label>任务 ID</label><input id="tk-id"></div>
<div class="form-row"><label>项目</label><input id="tk-project"></div>
<div class="form-row"><label>工作节点</label><input id="tk-worker" placeholder="自动"></div>
<div class="form-row"><label>角色</label><select id="tk-role"><option value="implement">实现</option><option value="review">审查</option><option value="test">测试</option><option value="integration">集成</option><option value="ops">运维</option></select></div>
<div class="form-row"><label>任务文件</label><input id="tk-file" placeholder="可选"></div>
<button class="btn btn-primary" onclick="createTask()">创建</button>
</div>`;
}

async function createTask(){
const body={task_id:document.getElementById('tk-id').value,project_id:document.getElementById('tk-project').value,role:document.getElementById('tk-role').value};
const w=document.getElementById('tk-worker').value;if(w)body.worker_id=w;
const f=document.getElementById('tk-file').value;if(f)body.task_file=f;
await api('/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
location.reload();
}

async function cancelTask(id){
await api(`/tasks/${id}/cancel`,{method:'POST'});
location.reload();
}

async function loadWorkers(){
const r=await api('/workers');
return `
<div class="card"><h2>工作节点列表</h2>
<table><tr><th>ID</th><th>启用</th><th>角色</th><th>技能</th><th>代理类型</th><th>主机</th></tr>
${(r.workers||[]).map(w=>`<tr><td>${esc(w.id)}</td><td>${w.enabled?'✅':'❌'}</td><td>${esc((w.roles||[]).join(', '))}</td><td>${esc((w.skills||[]).join(', '))}</td><td>${esc(w.agent_type||'-')}</td><td>${esc(w.host||'本地')}</td></tr>`).join('')}
</table></div>`;
}

async function loadReview(){
const r=await api('/tasks');
const reviewTasks=(r.tasks||[]).filter(t=>t.state==='review_required'||t.state==='fix_required');
return `
<div class="card"><h2>审查队列</h2>
${reviewTasks.length===0?'<p class="muted">暂无待审查任务</p>':''}
<table><tr><th>ID</th><th>状态</th><th>项目</th><th>角色</th><th>操作</th></tr>
${reviewTasks.map(t=>`<tr><td>${esc(t.task_id)}</td><td>${badge(t.state)}</td><td>${esc(t.project_id)}</td><td>${esc(t.role)}</td>
<td>
<button class="btn btn-primary" onclick="reviewPass('${esc(t.task_id)}')">通过</button>
<button class="btn btn-danger" onclick="reviewFix('${esc(t.task_id)}')">需修复</button>
</td></tr>`).join('')}
</table></div>`;
}

async function reviewPass(id){
await api(`/tasks/${id}/review/pass`,{method:'POST'});
location.reload();
}

async function reviewFix(id){
await api(`/tasks/${id}/review/fix`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fix_file:''})});
location.reload();
}

async function loadSettings(){
const h=await api('/health');
return `
<div class="card"><h2>桥接配置</h2>
<p class="muted">版本: ${esc(h.version||'?')}</p>
<p class="muted">根目录: ${esc(h.bridge_root||'?')}</p>
<p class="muted">接口状态: ${esc(h.status||'?')}</p>
</div>
<div class="card"><h2>运行时设置</h2>
<div class="form-row"><label>最大工作节点数</label><input type="number" value="4" id="cfg-max-workers"></div>
<div class="form-row"><label>软超时</label><input type="number" value="12" id="cfg-soft-timeout"><span class="muted">分钟</span></div>
<div class="form-row"><label>硬超时</label><input type="number" value="15" id="cfg-hard-timeout"><span class="muted">分钟</span></div>
<button class="btn btn-primary" onclick="alert('设置已保存（演示）')">保存</button>
</div>
<div class="card"><h2>日志</h2>
<div class="form-row"><label>日志级别</label><select><option>调试</option><option selected>信息</option><option>警告</option><option>错误</option></select></div>
</div>`;
}

const pages={dashboard:loadDashboard,projects:loadProjects,tasks:loadTasks,workers:loadWorkers,review:loadReview,settings:loadSettings};

async function navigate(page){
document.querySelectorAll('.nav-link').forEach(a=>a.classList.remove('active'));
document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
const fn=pages[page]||loadDashboard;
try{document.getElementById('content').innerHTML=await fn()}catch(e){document.getElementById('content').innerHTML=`<div class="card"><p class="muted">错误: ${esc(e)}</p></div>`}
}

window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)||'dashboard'));
window.addEventListener('load',()=>navigate(location.hash.slice(1)||'dashboard'));
</script>
</body>
</html>
